name: Actualiser les scores

on:
  schedule:
    - cron: '20 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update-results.mjs
      - .github/workflows/update-results.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: betmaster-pages
  cancel-in-progress: false

jobs:
  update:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synchroniser les dernières données
        run: git pull --rebase origin main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Télécharger les scores officiels récents
        run: node scripts/update-results.mjs
      - name: Publier les nouveaux résultats
        run: |
          git config user.name "betmaster-results[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fixtures.json data/predictions-history.json
          git diff --cached --quiet || git commit -m "chore: actualise les scores officiels"
          git push
      - name: Configurer la synchronisation des comptes
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/configure-supabase.mjs --required
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Déployer les scores actualisés
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Synchroniser les matchs et régler les paris certifiés
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-supabase.mjs
