name: Inventorier les marchés PropLine
# BET-154 : diagnostic manuel en lecture seule. Aucune écriture dans le dépôt, aucun déploiement.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Catalogue ou prix BET-170 : lots, périodes demandées H1/H2'
        type: choice
        options: [catalogue, prices, composites, remaining, h1, h2]
        default: catalogue
      budget:
        description: 'Nombre maximal de requêtes PropLine (60 au plus)'
        default: '56'
        type: string
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Relever les marchés servis par PropLine
        env:
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
          PROPLINE_INVENTORY_BUDGET: ${{ inputs.budget }}
          PROPLINE_INVENTORY_MODE: ${{ inputs.mode }}
        run: |
          if [ "$PROPLINE_INVENTORY_MODE" = "prices" ]; then
            node scripts/propline-prices.mjs
            node scripts/check-markets-lot-one.mjs
          elif [ "$PROPLINE_INVENTORY_MODE" = "composites" ]; then
            PROPLINE_PRICE_SCOPE=composites node scripts/propline-prices.mjs
            node scripts/check-markets-composites.mjs > propline-composites-audit.json
          elif [ "$PROPLINE_INVENTORY_MODE" = "remaining" ] || [ "$PROPLINE_INVENTORY_MODE" = "h1" ] || [ "$PROPLINE_INVENTORY_MODE" = "h2" ]; then
            PROPLINE_PRICE_SCOPE="$PROPLINE_INVENTORY_MODE" node scripts/propline-prices.mjs
          else
            node scripts/propline-inventory.mjs
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: propline-inventory
          path: |
            propline-inventory.json
            propline-inventory.md
            propline-prices.json
            propline-composites-audit.json
          if-no-files-found: ignore
          retention-days: 7
