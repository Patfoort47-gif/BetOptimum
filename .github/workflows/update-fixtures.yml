name: Actualiser les matchs

on:
  schedule:
    # 7 h, 14 h et 19 h à Paris, avec les deux décalages UTC été/hiver.
    - cron: '0 5,6,12,13,17,18 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: betmaster-pages
  cancel-in-progress: false

jobs:
  update:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier le créneau horaire de Paris
        id: schedule
        run: |
          case "$(TZ=Europe/Paris date +%H)" in
            07|14|19) echo "run=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "run=false" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: actions/checkout@v4
        if: steps.schedule.outputs.run == 'true'
      - name: Synchroniser les dernières données
        if: steps.schedule.outputs.run == 'true'
        run: git pull --rebase origin main
      - uses: actions/setup-node@v4
        if: steps.schedule.outputs.run == 'true'
        with:
          node-version: 20
      - name: Télécharger les calendriers officiels
        if: steps.schedule.outputs.run == 'true'
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: node scripts/update-fixtures.mjs
      - name: Publier les nouvelles données
        if: steps.schedule.outputs.run == 'true'
        run: |
          git config user.name "betmaster-fixtures[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fixtures.json
          git diff --cached --quiet || git commit -m "chore: actualise les matchs officiels"
          git push
      - name: Configurer la synchronisation des comptes
        if: steps.schedule.outputs.run == 'true'
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/configure-supabase.mjs --required
      - uses: actions/configure-pages@v5
        if: steps.schedule.outputs.run == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.schedule.outputs.run == 'true'
        with:
          path: .
      - name: Déployer le calendrier actualisé
        id: deployment
        if: steps.schedule.outputs.run == 'true'
        uses: actions/deploy-pages@v4
      - name: Synchroniser les matchs et régler les paris certifiés
        if: steps.schedule.outputs.run == 'true'
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-supabase.mjs
