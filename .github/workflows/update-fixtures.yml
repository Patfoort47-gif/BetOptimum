name: Actualiser les matchs

on:
  workflow_dispatch:
    inputs:
      force_odds_sync:
        description: 'Forcer une collecte de cotes maintenant (exception au délai de 12 h)'
        type: boolean
        default: false
      notify_after_update:
        description: 'Envoyer aussi les briefings consentis après une collecte manuelle'
        type: boolean
        default: false
  schedule:
    # 6 h et 18 h à Paris, avec les deux décalages UTC été/hiver.
    - cron: '0 4,16 * * *'
    - cron: '0 5,17 * * *'
    # Rattrape un déclenchement GitHub retardé ou manqué, sans contourner le quota.
    - cron: '27 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: betmaster-pages
  cancel-in-progress: false

jobs:
  update:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Vérifier les créneaux de Paris et le rattrapage
        id: schedule
        env:
          MANUAL_CALENDAR_SYNC: ${{ github.event_name == 'workflow_dispatch' }}
        run: node scripts/calendar-schedule.mjs >> "$GITHUB_OUTPUT"
      - name: Synchroniser les dernières données
        if: steps.schedule.outputs.run == 'true'
        run: git pull --rebase origin main
      - name: Vérifier la migration des nouveaux marchés
        if: steps.schedule.outputs.run == 'true'
        env:
          PROPLINE_MARKET_STAGE: '3'
          PROPLINE_H1_ENABLED: 'false'
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/check-market-deployment.mjs
      - name: Réserver durablement le quota avant les appels fournisseur
        id: quota
        env:
          FORCE_ODDS_SYNC: ${{ github.event_name == 'workflow_dispatch' && inputs.force_odds_sync == true }}
        if: steps.schedule.outputs.run == 'true'
        run: |
          node scripts/odds-sync-quota.mjs
          if ! git diff --quiet -- data/odds-sync-attempts.json || [ -n "$(git ls-files --others --exclude-standard data/odds-sync-attempts.json)" ]; then
            git config user.name "betmaster-fixtures[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/odds-sync-attempts.json
            git commit -m "BET-211 Réserve le quota des cotes"
            git push origin HEAD:main
            echo "reserved_at=$(node -p 'JSON.parse(require("fs").readFileSync("data/odds-sync-attempts.json")).at(-1)')" >> "$GITHUB_OUTPUT"
          fi
      - name: Télécharger les calendriers officiels
        if: steps.schedule.outputs.run == 'true'
        env:
          ODDS_SYNC_RESERVED_AT: ${{ steps.quota.outputs.reserved_at }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          PROPLINE_MARKET_STAGE: '3'
          PROPLINE_H1_ENABLED: 'false'
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
        run: node scripts/update-fixtures.mjs
      - name: Résumer la santé des cotes
        if: steps.schedule.outputs.run == 'true'
        run: |
          node -e 'const f=require("./data/fixtures.json"); console.log("## Santé des cotes\n\n"+JSON.stringify({lastOdds:f.oddsRefreshedAt,health:f.oddsHealth,coverage:f.coverage,failures:f.failures},null,2))' >> "$GITHUB_STEP_SUMMARY"
      - name: Compléter les lieux des rencontres
        if: steps.schedule.outputs.run == 'true'
        run: |
          node scripts/enrich-stadium-venues.mjs
          node scripts/check-stadium-coverage.mjs --report
      - name: Publier les nouvelles données
        if: steps.schedule.outputs.run == 'true'
        run: |
          git config user.name "betmaster-fixtures[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fixtures.json data/offers
          git diff --cached --quiet || git commit -m "chore: actualise les matchs officiels"
          git push
      - name: Configurer la synchronisation des comptes
        if: steps.schedule.outputs.run == 'true'
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/configure-supabase.mjs --required
      - uses: actions/configure-pages@v5
        if: steps.schedule.outputs.run == 'true'
      - name: Préparer les fichiers publics
        if: steps.schedule.outputs.run == 'true'
        run: node scripts/prepare-pages.mjs
      - uses: actions/upload-pages-artifact@v3
        if: steps.schedule.outputs.run == 'true'
        with:
          path: _site
      - name: Déployer le calendrier actualisé
        id: deployment
        if: steps.schedule.outputs.run == 'true'
        uses: actions/deploy-pages@v4
      - name: Synchroniser les matchs et régler les paris certifiés
        if: steps.schedule.outputs.run == 'true'
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-supabase.mjs
      - name: Envoyer les briefings consentis après actualisation réussie
        if: steps.schedule.outputs.run == 'true' && ((github.event_name == 'schedule' && github.event.schedule != '27 * * * *') || inputs.notify_after_update == true)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          NOTIFICATION_WORKER_SECRET: ${{ secrets.NOTIFICATION_WORKER_SECRET }}
          BRIEFING_AFTER_UPDATE: 'true'
        run: node scripts/run-notifications.mjs
