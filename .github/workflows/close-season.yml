name: Clôturer la saison de ligue

on:
  schedule:
    # Chaque jour à 00:30 Paris (deux décalages UTC été/hiver) : ne fait quelque chose que si une saison est terminée.
    - cron: '30 22,23 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/close-season.mjs
      - scripts/league-engine.mjs
      - league.js
      - .github/workflows/close-season.yml

concurrency:
  group: betmaster-league
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Clôturer les saisons terminées
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/close-season.mjs
