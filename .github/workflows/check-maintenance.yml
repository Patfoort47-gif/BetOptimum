name: Vérifier le dépôt
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: node scripts/check-migrations.mjs
      - run: npm test
      - run: node scripts/prepare-pages.mjs
      - run: node scripts/check-module-paths.mjs
      - run: node scripts/check-links.mjs
