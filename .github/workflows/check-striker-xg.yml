name: Vérifier les xG manquants avec StrikerAPI
on:
  push:
    branches: [BET-99-striker-xg]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: |
          node --input-type=module <<'JS'
          try {
            await import('./scripts/check-striker-xg.mjs');
          } catch (error) {
            const message = /^(StrikerAPI HTTP \d+|Calendrier public HTTP \d+|Secret STRIKERAPI_API_KEY absent|Calendrier StrikerAPI invalide)$/.test(error.message)
              ? error.message
              : 'Échec du diagnostic : ' + error.name + ' ' + (error.cause?.code ?? '');
            console.log('::error::' + message);
            process.exitCode = 1;
          }
          JS
        env:
          STRIKERAPI_API_KEY: ${{ secrets.STRIKERAPI_API_KEY }}
